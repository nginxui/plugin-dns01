name: Release

# Builds, signs and publishes the per-platform packages when a version
# tag is pushed. The tag must match plugin.json, e.g. v1.0.0 for
# "version": "1.0.0".
#
# The "release" environment holds the signing key: PLUGIN_SIGNING_KEY is the
# minisign secret key file and PLUGIN_SIGNING_KEY_PASSWORD its password. Give
# the environment a required reviewer so a pushed tag alone cannot sign. The
# PLUGIN_SIGNING_PUBLIC_KEY variable, the matching public key, lets
# nginxui/plugin-release check what it signed. The catalog (nginxui/plugins)
# polls this repository's releases and picks the new one up on its own.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  # The tests and the checks of plugin.json, apart from the builds so both run
  # at the same time.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: oven-sh/setup-bun@v2

      - name: Check that the tag matches plugin.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(sed -n 's/^  "version": "\(.*\)",$/\1/p' plugin.json | head -n 1)
          if [ "${tag}" != "${version}" ]; then
            echo "tag v${tag} does not match plugin.json version ${version}"
            exit 1
          fi

      - name: Build the webapp bundle
        working-directory: webapp
        run: |
          bun install --frozen-lockfile
          bun run build

      - run: go test -race -count=1 ./...

      - name: plugin.json is up to date
        run: |
          go run ./cmd/manifest -out "${RUNNER_TEMP}/plugin.json" >/dev/null
          diff -u plugin.json "${RUNNER_TEMP}/plugin.json"

  # One executable per platform, each in a job of its own: a single job builds
  # the provider code fifteen times over.
  build:
    name: build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: '386' }
          - { goos: linux, goarch: arm }
          - { goos: linux, goarch: riscv64 }
          - { goos: linux, goarch: loong64 }
          - { goos: linux, goarch: mips }
          - { goos: linux, goarch: mipsle }
          - { goos: linux, goarch: mips64 }
          - { goos: linux, goarch: mips64le }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: windows, goarch: '386' }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # linux/arm is built for ARMv5, which ARMv6 and ARMv7 run too.
      - name: Build the executable
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: '5'
        run: |
          set -euo pipefail
          name="dns01-${GOOS}-${GOARCH}"
          if [[ "${GOOS}" == windows ]]; then
            name="${name}.exe"
          fi
          mkdir -p "${RUNNER_TEMP}/out"
          go build -trimpath -ldflags "-s -w" -o "${RUNNER_TEMP}/out/${name}" .

      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [test, build]
    runs-on: ubuntu-latest
    environment: release
    defaults:
      run:
        working-directory: plugin-dns01
    steps:
      - uses: actions/checkout@v7
        with:
          path: plugin-dns01
          # git-cliff reads the commits since the previous tag.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: plugin-dns01/go.mod
          cache-dependency-path: plugin-dns01/go.sum

      - uses: oven-sh/setup-bun@v2

      # The packages carry the webapp bundle
      - name: Build the webapp bundle
        working-directory: plugin-dns01/webapp
        run: |
          bun install --frozen-lockfile
          bun run build

      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          merge-multiple: true
          path: plugin-dns01/binaries

      - name: Build the packages
        run: ./build.sh --prebuilt binaries

      # Signs the packages with the official plugin key, checks them and
      # publishes them, with notes git-cliff (cliff.toml) writes from the
      # commits since the previous tag.
      - uses: nginxui/plugin-release@v1
        with:
          working-directory: plugin-dns01
          signing-key: ${{ secrets.PLUGIN_SIGNING_KEY }}
          signing-key-password: ${{ secrets.PLUGIN_SIGNING_KEY_PASSWORD }}
          certificate: ''
          trusted-key: ${{ vars.PLUGIN_SIGNING_PUBLIC_KEY }}
          publish: true
