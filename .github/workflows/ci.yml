name: CI

# Runs on every pull request and on main. The SDKs are regular dependencies:
# the github.com/nginxui/plugin-sdk-go module and @nginxui/plugin-sdk on npm.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin-dns01
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin-dns01

      - uses: actions/setup-go@v5
        with:
          go-version-file: plugin-dns01/go.mod
          cache-dependency-path: plugin-dns01/go.sum

      - uses: oven-sh/setup-bun@v2

      - name: Build the webapp bundle
        working-directory: plugin-dns01/webapp
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run build

      - name: gofmt
        run: |
          files=$(gofmt -l .)
          if [ -n "${files}" ]; then
            echo "gofmt would change:"
            echo "${files}"
            exit 1
          fi

      - run: go vet ./...

      - run: go test -race -count=1 ./...

      # plugin.json is committed and the catalog reads it from the release
      # tag, so it must be what cmd/manifest generates from the code and the
      # webapp fragment.
      - name: plugin.json is up to date
        run: |
          go run ./cmd/manifest -out "${RUNNER_TEMP}/plugin.json" >/dev/null
          diff -u plugin.json "${RUNNER_TEMP}/plugin.json"

      - name: Package the runner's platform
        run: ./build.sh --host-only
